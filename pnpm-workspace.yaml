# Minimum age for new packages before they can be used (in minutes) – 10080 min = 1 week
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - glob@14.0.6
  - minimatch@11.0.8

# Hoist all dependencies to the root of node_modules. Without it, eslint's
# import-x plugin cannot resolve re-exports from transitive dependencies
# (e.g. screen from @testing-library/react via @testing-library/dom).
shamefullyHoist: true

# The minimatch override fixes the version used by @typescript-eslint/typescript-estree.
overrides:
  '@babel/core': 7.29.6
  '@humanfs/node': 0.16.8
  '@typescript-eslint/typescript-estree>minimatch': 9.0.7
  'esbuild@<=0.24.2': 0.25.0
  'immutable@^5': '^5.1.8'
  'js-yaml@^3': '^3.15.1'
  'js-yaml@^4': '^4.3.1'
  'brace-expansion': '^5.0.12'
  'fast-uri': '^3.1.9'
  'postcss': '^8.5.18'
  'postcss-selector-parser@<7.1.6': '^7.1.6'
  'source-map-js': '^1.2.2'
  'zod': '^4.6.6'
  'esrun>chokidar': '^4.0.3'
  'ws': '^8.21.0'
  '@simple-git/argv-parser': '>=2.0.1'
  'glob@>=9.0.0 <=14.0.1': '>=14.0.2'

# Allow plugins that haven't yet updated their peer dep to accept eslint@10.
# The plugins work fine under v10; the peer range is just stale.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'

# pnpm 11 requires explicit opt-in for packages that run install scripts.
# - @parcel/watcher: used by sass and vite for file system watching
# - core-js: does not require a native build, denied as unnecessary
# - esbuild: downloads its native binary during installation
# - unrs-resolver: Rust-based module resolver used by eslint-plugin-import-x
allowBuilds:
  '@parcel/watcher': true
  core-js: false
  esbuild: true
  unrs-resolver: true
